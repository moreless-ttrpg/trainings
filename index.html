<style>
/* Layout: sticky week header, day strip, one day's exercise cards, fixed bottom action bar. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#16212B; --muted:#66737E; --line:#D8DDE2;
  --accent:#C8410B; --accent-ink:#FFFFFF; --accent-soft:#FBE6DB;
  --ok:#167A5E; --ok-soft:#DCF0E8; --danger:#B3261E;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171D; --surface:#1A232B; --ink:#E8EDF1; --muted:#93A0AB; --line:#2B3640;
  --accent:#FF8C52; --accent-ink:#1B0E05; --accent-soft:#3A2519;
  --ok:#4FC9A0; --ok-soft:#17352B; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171D; --surface:#1A232B; --ink:#E8EDF1; --muted:#93A0AB; --line:#2B3640;
  --accent:#FF8C52; --accent-ink:#1B0E05; --accent-soft:#3A2519;
  --ok:#4FC9A0; --ok-soft:#17352B; --danger:#FF8A80; color-scheme:dark}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;max-width:560px;margin-inline:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px}
.wk{display:flex;align-items:center;gap:8px}
.wk .lbl{flex:1;min-width:0}
.wk .lbl b{display:block;font:600 22px/1.1 var(--display);letter-spacing:.02em}
.wk .lbl span{font-size:13px;color:var(--muted)}
.ic{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.ic:disabled{opacity:.35}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.chip{min-height:56px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.chip b{font:500 15px/1 var(--display);letter-spacing:.04em}
.chip i{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);display:block}
.chip.rest i{border-style:dashed;opacity:.5}
.chip.part i{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.chip.done i{background:var(--ok);border-color:var(--ok)}
.chip.today b{color:var(--accent)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sel.today b{color:var(--bg)}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 2px 10px}
.dayhead h2{font-size:26px;text-transform:uppercase}
.dayhead span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ex-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ex-h .t{flex:1;min-width:0}
.ex-h h3{font-size:19px;text-transform:uppercase;line-height:1.15}
.ex-h small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rt{min-height:44px;padding:0 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.cols,.set{display:grid;grid-template-columns:28px 1fr 1fr;gap:10px;align-items:center}
.cols{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 4px}
.set{padding:3px 0}
.set .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--bg);color:var(--muted)}
.set.done .n{background:var(--ok);color:#fff}
.step{display:grid;grid-template-columns:40px 1fr 40px;align-items:stretch;height:46px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
.step button{font-size:20px;color:var(--muted)}
.step input{width:100%;min-width:0;text-align:center;border:0;background:var(--surface);font-size:18px;font-weight:600}
.w{display:flex;align-items:center;gap:6px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px}
.w input{flex:1;min-width:0;width:100%;border:0;background:transparent;font-size:18px;font-weight:600;text-align:right}
.w span{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 90px}
.mini{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500}
.mini.danger{color:var(--danger)}
.btn{min-height:50px;border-radius:14px;padding:0 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:8px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar .in>button{flex:1;min-height:48px;border-radius:14px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.bar .in>button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timer{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:26;max-width:528px;margin:0 auto;border-radius:16px;
  background:var(--ink);color:var(--bg);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer.end{background:var(--accent);color:var(--accent-ink)}
.timer .tt{flex:1;min-width:0}
.timer b{font:600 28px/1 var(--display);letter-spacing:.03em;display:block}
.timer small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.timer button{min-width:44px;min-height:44px;border-radius:12px;background:rgba(127,127,127,.28);font-weight:600}

.nw h2{font-size:24px;margin:14px 2px 4px}
.nw p{color:var(--muted);margin:0 2px 12px;font-size:14px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts .w{height:40px;flex:1 1 110px}
details.card summary{font-weight:600;min-height:28px;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.kv small{color:var(--muted);display:block}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.opt{transition:background .15s,color .15s}}
</style></head><body>
<div id="app"></div>
<div id="timer" hidden></div>
<div id="bar" class="bar"><div class="in" id="barin"></div></div>
<script>
(function(){
"use strict";
var LS_KEY="fbtl.weeks.v1";
var MONTHS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var weeks={}, curId=null, dayIdx=0, edit=false, view="day", nw=null, db=null, loadNote="";
var timer=null, tick=null, dirty={}, saving={}, saveT={};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return n==null?"":String(Math.round(n*1000)/1000).replace(".",",")}
function pnum(s){var v=parseFloat(String(s).replace(",",".").replace(/[^0-9.\-]/g,""));return isNaN(v)?null:v}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function weekLabel(id){
  var a=parseIso(id), b=parseIso(addDays(id,6));
  if(a.getMonth()===b.getMonth())return a.getDate()+"–"+b.getDate()+" "+MONTHS[b.getMonth()];
  return a.getDate()+" "+MONTHS[a.getMonth()]+" – "+b.getDate()+" "+MONTHS[b.getMonth()];
}
function sortedIds(){return Object.keys(weeks).sort()}
function todayIso(){return iso(new Date())}
function todayDow(){return (new Date().getDay()+6)%7}
function uid(){return "e"+Math.random().toString(36).slice(2,9)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function cur(){return weeks[curId]}

/* ---------- storage: db (shared, survives devices) + localStorage mirror ---------- */
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify(weeks))}catch(e){}}
function touch(id){
  var w=weeks[id]; if(!w)return;
  w.updatedAt=Date.now(); lsWrite();
  if(!db)return;
  dirty[id]=true; clearTimeout(saveT[id]);
  saveT[id]=setTimeout(function(){flush(id)},700);
}
function flush(id){
  if(!db||saving[id]||!dirty[id])return;
  var w=weeks[id]; if(!w)return;
  saving[id]=true; dirty[id]=false;
  var data=clone(w); delete data._synced;
  db.collection("weeks").doc(id).set(data).then(function(){
    saving[id]=false; if(dirty[id])flush(id);
  },function(){saving[id]=false;dirty[id]=true;loadNote="Не удалось сохранить в облако. Данные сохранены на этом устройстве."; paintNote()});
}
function removeWeek(id){
  delete weeks[id]; lsWrite();
  if(db)db.collection("weeks").doc(id).delete().catch(function(){});
}
function onRemote(snap){
  var changed=false;
  snap.docs.forEach(function(d){
    var r=d.data(), l=weeks[d.id];
    if(!r)return;
    if(!l||(r.updatedAt||0)>(l.updatedAt||0)){weeks[d.id]=clone(r);weeks[d.id]._synced=true;changed=true}
    else if((l.updatedAt||0)>(r.updatedAt||0)){dirty[d.id]=true;flush(d.id)}
  });
  var remote={};snap.docs.forEach(function(d){remote[d.id]=1});
  Object.keys(weeks).forEach(function(id){
    if(remote[id]){weeks[id]._synced=true;return}
    if(snap.metadata.fromCache)return;
    if(weeks[id]._synced&&!dirty[id]&&!saving[id]){delete weeks[id];changed=true}
    else if(!weeks[id]._synced){dirty[id]=true;flush(id)}
  });
  if(!snap.metadata.fromCache){clearTimeout(loadTimer);loadNote=""}
  lsWrite();
  if(changed){
    if(!weeks[curId])pickStart();
    if(!document.activeElement||document.activeElement.tagName!=="INPUT")render();
  }
  paintNote();
}
var loadTimer=null;
function connect(){
  return;
  window.claude.use("db").then(function(d){
    if(!d)return;
    db=d;
    loadTimer=setTimeout(function(){loadNote="Облако не отвечает. Показаны данные с этого устройства.";paintNote()},10000);
    db.collection("weeks").onSnapshot(onRemote,function(){loadNote="Нет доступа к облаку. Данные хранятся на этом устройстве.";paintNote()});
  },function(){});
}
function paintNote(){var n=$("#note");if(n){n.hidden=!loadNote;n.textContent=loadNote}}

/* ---------- selection ---------- */
function pickStart(){
  var ids=sortedIds(); if(!ids.length){curId=null;return}
  var t=todayIso(), hit=null;
  ids.forEach(function(id){if(id<=t&&t<=addDays(id,6))hit=id});
  curId=hit||ids[ids.length-1];
  if(hit)dayIdx=todayDow();
  else{var d=cur().days;dayIdx=0;for(var i=0;i<7;i++){if(!d[i].rest){dayIdx=i;break}}}
}
function setStats(ex){var t=0,f=0;ex.forEach(function(e){e.sets.forEach(function(s){t++;if(s.reps!=null)f++})});return{t:t,f:f}}
function dayState(d){
  if(d.rest)return "rest";
  var s=setStats(d.exercises);
  if(!s.t||!s.f)return "none";
  return s.f===s.t?"done":"part";
}

/* ---------- rendering ---------- */
var confirmDel=null, confirmWeek=false;
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60)}
function topHtml(){
  var ids=sortedIds(), i=ids.indexOf(curId), w=cur(), tw=0, td=0;
  w.days.forEach(function(d){if(!d.rest){tw++;if(dayState(d)==="done")td++}});
  var t=todayIso(), isNow=curId<=t&&t<=addDays(curId,6);
  var h='<div class="top"><div class="wk"><button class="ic" data-act="prev" aria-label="Предыдущая неделя"'+(i<=0?" disabled":"")+'>‹</button>'+
   '<div class="lbl"><b class="num">'+weekLabel(curId)+'</b><span>'+(isNow?"Текущая неделя · ":"")+td+" из "+tw+' тренировок</span></div>'+
   '<button class="ic" data-act="next" aria-label="Следующая неделя"'+(i>=ids.length-1?" disabled":"")+'>›</button></div>'+
   '<div class="days">';
  w.days.forEach(function(d,k){
    var cls=["chip",dayState(d)];
    if(k===dayIdx)cls.push("sel");
    if(isNow&&k===todayDow())cls.push("today");
    h+='<button class="'+cls.join(" ")+'" data-act="day" data-d="'+k+'" aria-label="'+esc(d.name)+'"><b>'+SHORT[k]+'</b><i></i></button>';
  });
  return h+'</div><div class="note" id="note" hidden></div></div>';
}
function setRow(ex,s,i,editing){
  if(editing){
    return '<div class="set" style="grid-template-columns:28px 1fr"><span class="n">'+(i+1)+'</span><label class="w"><input inputmode="decimal" data-f="weight" data-ex="'+ex.id+'" data-i="'+i+'" value="'+fmt(s.weight)+'" aria-label="Вес, подход '+(i+1)+'"><span>кг</span></label></div>';
  }
  return '<div class="set'+(s.reps!=null?" done":"")+'" data-ex="'+ex.id+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+
   '<div class="step"><button data-act="dec" aria-label="Меньше">−</button><input inputmode="numeric" data-f="reps" data-ex="'+ex.id+'" data-i="'+i+'" placeholder="'+ex.min+'–'+ex.max+'" value="'+(s.reps==null?"":s.reps)+'" aria-label="Повторы, подход '+(i+1)+'"><button data-act="inc" aria-label="Больше">+</button></div>'+
   '<label class="w"><input inputmode="decimal" data-f="weight" data-ex="'+ex.id+'" data-i="'+i+'" value="'+fmt(s.weight)+'" aria-label="Вес, подход '+(i+1)+'"><span>кг</span></label></div>';
}
function exCard(ex,idx,n){
  var h='<div class="card" data-exc="'+ex.id+'">';
  if(!edit){
    h+='<div class="ex-h"><div class="t"><h3>'+esc(ex.name)+'</h3>'+(ex.variant?'<small>'+esc(ex.variant)+'</small>':"")+'</div>'+
      '<button class="rt" data-act="timer" data-ex="'+ex.id+'">⏱ '+mmss(ex.rest||0)+'</button></div>'+
      '<div class="cols"><span></span><span>Повторы · '+ex.min+'–'+ex.max+'</span><span>Вес</span></div>';
    ex.sets.forEach(function(s,i){h+=setRow(ex,s,i,false)});
    return h+'</div>';
  }
  h+='<div class="row"><label class="fld" style="flex-basis:100%">Название<input data-f="name" data-ex="'+ex.id+'" value="'+esc(ex.name)+'"></label>'+
    '<label class="fld" style="flex-basis:100%">Вариант<input data-f="variant" data-ex="'+ex.id+'" value="'+esc(ex.variant)+'"></label>'+
    '<label class="fld">Повторы от<input inputmode="numeric" data-f="min" data-ex="'+ex.id+'" value="'+ex.min+'"></label>'+
    '<label class="fld">до<input inputmode="numeric" data-f="max" data-ex="'+ex.id+'" value="'+ex.max+'"></label>'+
    '<label class="fld">Отдых, с<input inputmode="numeric" data-f="rest" data-ex="'+ex.id+'" value="'+(ex.rest||"")+'"></label></div>';
  h+='<div class="row" style="margin:12px 0 8px;align-items:center"><span style="flex:1 1 auto;font-weight:600">Подходов: <span class="num">'+ex.sets.length+'</span></span>'+
    '<button class="mini" style="flex:0 0 48px" data-act="setsMinus" data-ex="'+ex.id+'" aria-label="Убрать подход">−</button>'+
    '<button class="mini" style="flex:0 0 48px" data-act="setsPlus" data-ex="'+ex.id+'" aria-label="Добавить подход">+</button></div>';
  ex.sets.forEach(function(s,i){h+=setRow(ex,s,i,true)});
  h+='<div class="row" style="margin-top:12px"><button class="mini" data-act="up" data-ex="'+ex.id+'"'+(idx===0?" disabled":"")+'>↑ Выше</button>'+
    '<button class="mini" data-act="down" data-ex="'+ex.id+'"'+(idx===n-1?" disabled":"")+'>↓ Ниже</button>'+
    '<button class="mini danger" data-act="del" data-ex="'+ex.id+'">'+(confirmDel===ex.id?"Точно удалить?":"Удалить")+'</button></div></div>';
  return h;
}
function dayHtml(){

function createWeek(){

function beep(){try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function startTimer(sec,label){
  timer={end:Date.now()+sec*1000,label:label,done:false};
  var el=$("#timer");
  el.innerHTML='<button data-act="tm" data-v="-15">−15</button><div class="tt"><b class="num" id="tmv"></b><small>'+esc(label)+'</small></div><button data-act="tm" data-v="15">+15</button><button data-act="tm" data-v="x" aria-label="Закрыть">✕</button>';
  el.hidden=false; clearInterval(tick); tick=setInterval(paintTimer,250); paintTimer();
}
function paintTimer(){
  var el=$("#timer"); if(!timer){el.hidden=true;clearInterval(tick);return}
  var left=(timer.end-Date.now())/1000;
  if(left<=0&&!timer.done){timer.done=true;beep()}
  if(left>0&&timer.done)timer.done=false;
  el.className="timer"+(timer.done?" end":"");
  var v=$("#tmv"); if(v)v.textContent=timer.done?"Пора":mmss(Math.ceil(left));
}

/* ---------- events ---------- */
function exOf(el){
  var id=el.getAttribute("data-ex")||(el.closest("[data-ex]")||{getAttribute:function(){}}).getAttribute("data-ex");
  var d=cur()&&cur().days[dayIdx]; if(!d)return null;
  for(var i=0;i<d.exercises.length;i++)if(d.exercises[i].id===id)return d.exercises[i];
  return null;
}
function moveEx(ex,dir){
  var a=cur().days[dayIdx].exercises,i=a.indexOf(ex),j=i+dir;
  if(j<0||j>=a.length)return; a.splice(i,1);a.splice(j,0,ex);
}
function stepReps(btn,dir){
  var row=btn.closest(".set"), ex=exOf(row), i=+row.getAttribute("data-i"), s=ex.sets[i];
  if(s.reps==null){s.reps=(i>0&&ex.sets[i-1].reps!=null)?ex.sets[i-1].reps:ex.max}
  else s.reps=Math.max(0,s.reps+dir);
  row.querySelector('[data-f="reps"]').value=s.reps; row.classList.add("done");
  touch(curId); paintChips();
}
function nextId(dir){var ids=sortedIds(),i=ids.indexOf(curId)+dir;return ids[i]}
function act(a,b){
  if(a!=="del")confirmDel=null; if(a!=="delWeek")confirmWeek=false;
  var w=cur(), ex;
  switch(a){
  case "prev":case "next":{var id=nextId(a==="next"?1:-1);if(id){curId=id;var t=todayIso();if(t>=id&&t<=addDays(id,6))dayIdx=todayDow();render();window.scrollTo(0,0)}break}
  case "day":dayIdx=+b.getAttribute("data-d");render();window.scrollTo(0,0);break;
  case "dec":stepReps(b,-1);break;
  case "inc":stepReps(b,1);break;
  case "timer":ex=exOf(b);if(ex)startTimer(ex.rest||90,ex.name);break;
  case "tm":{var v=b.getAttribute("data-v");if(v==="x"){timer=null;paintTimer()}else if(timer){timer.end+=(+v)*1000;paintTimer()}break}
  case "toggleEdit":edit=!edit;render();break;
  case "toggleRest":{var d=w.days[dayIdx];d.rest=!d.rest;if(d.rest&&(!d.title||d.title==="Тренировка"))d.title="Отдых";if(!d.rest&&d.title==="Отдых")d.title="Тренировка";touch(curId);render();break}
  case "addEx":w.days[dayIdx].exercises.push({id:uid(),name:"НОВОЕ УПРАЖНЕНИЕ",variant:"",min:6,max:10,rest:150,sets:[{reps:null,weight:0},{reps:null,weight:0},{reps:null,weight:0}]});touch(curId);render();break;
  case "up":case "down":ex=exOf(b);if(ex){moveEx(ex,a==="up"?-1:1);touch(curId);render()}break;
  case "del":ex=exOf(b);if(ex){if(confirmDel===ex.id){var arr=w.days[dayIdx].exercises;arr.splice(arr.indexOf(ex),1);confirmDel=null;touch(curId)}else confirmDel=ex.id;render()}break;
  case "setsPlus":ex=exOf(b);if(ex){var l=ex.sets[ex.sets.length-1];ex.sets.push({reps:null,weight:l?l.weight:0});touch(curId);render()}break;
  case "setsMinus":ex=exOf(b);if(ex&&ex.sets.length>1){ex.sets.pop();touch(curId);render()}break;
  case "delWeek":if(confirmWeek){var gone=curId;removeWeek(gone);confirmWeek=false;edit=false;pickStart();render();window.scrollTo(0,0)}else{confirmWeek=true;render()}break;
  case "newWeek":startNew();break;
  case "exportData":exportData();break;
  case "importData":{var f=$("#impf");if(f)f.click();break}
  case "cancelNew":view="day";nw=null;render();break;
  case "createWeek":createWeek();break;
  case "createFirst":createFirst();break;
  case "nwOpt":{var id2=b.getAttribute("data-ex"),vv=b.getAttribute("data-v");
    if(vv==="keep")delete nw.choice[id2];
    else{var found=null;weeks[nw.src].days.forEach(function(d){d.exercises.forEach(function(e){if(e.id===id2)found=e})});nw.choice[id2]=Math.round((maxW(found)+parseFloat(vv))*1000)/1000}
    render();break}
  }
}
