<style>
:root{--bg:#EEEEEE;--ink:#2D2D2D;--mute:#777777;--ph:#B3B3B3;--red:#9C2327;--on:#FAFAFA;--dark:#2D2D2D;--shd:rgba(0,0,0,.15);--shl:#FFFFFF;--f:"Unbounded",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
html{-webkit-text-size-adjust:100%}
body{color:var(--ink);font:400 12px/1.4 var(--f);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
button,input{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;border-radius:10px;outline:none}
button{cursor:pointer}
button:disabled{opacity:1;background:none;box-shadow:none;transform:none;color:var(--ph);pointer-events:none;cursor:default}
[hidden]{display:none!important}
#app{max-width:390px;margin:0 auto;min-height:100vh}
.rz{background:var(--bg);box-shadow:2px 2px 4px var(--shd),-2px -2px 4px var(--shl)}
.ps{background:var(--bg);box-shadow:inset -2px -2px 4px var(--shl),inset 2px 2px 4px var(--shd)}

.top{position:sticky;top:0;z-index:15;background:var(--bg);padding:max(40px,calc(env(safe-area-inset-top,0px) + 12px)) 23px 12px}
.top.plain{position:static;padding-bottom:0}
.top:not(.plain)::after{content:"";position:absolute;left:0;right:0;top:100%;height:52px;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0,rgba(238,238,238,.7) 30%,rgba(238,238,238,.25) 65%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(to bottom,#000 0,rgba(0,0,0,.85) 25%,rgba(0,0,0,.5) 55%,rgba(0,0,0,.18) 80%,transparent);mask-image:linear-gradient(to bottom,#000 0,rgba(0,0,0,.85) 25%,rgba(0,0,0,.5) 55%,rgba(0,0,0,.18) 80%,transparent)}
.wk{display:flex;gap:6px;height:44px}
.ar{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font:700 16px var(--f);flex:none}
.ar.off{visibility:hidden}
.ar.plus{color:var(--mute)}
.pill{flex:1;min-width:0;height:44px;border-radius:10px;background:var(--dark);color:var(--on);box-shadow:inset 0 0 8px rgba(0,0,0,.5);display:grid;place-items:center;font:700 15px/1 var(--f);text-transform:uppercase;white-space:nowrap}
.pill.sm{font-size:11px}
.days{display:flex;gap:6px;margin-top:24px}
.dy{width:44px;height:44px;flex:none;font:700 15px/1 var(--f);text-transform:uppercase;color:var(--ink)}
.dy.rest{color:var(--mute)}
.dy.sel{background:var(--red);color:var(--on)}
.dy.sel.rest{background:var(--dark)}

.list{padding:44px 23px 180px}
.list.nwl,.list.emp{padding-top:20px}
.list.emp{padding-top:calc(50vh - 150px)}
.ex{margin-bottom:56px}
.nm{font:700 15px/15px var(--f);text-transform:uppercase;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
.vr{font:400 12px/16px var(--f);color:var(--mute);min-height:16px}
.rs{position:relative;margin-top:10px}
.r{position:relative;height:44px;margin-bottom:14px}
.r>*,.nr2>*{position:absolute;top:0}
.wt{left:0;width:94px;height:44px;text-align:center;font:700 20px var(--f)}
.wt.sm{font-size:15px}
.kg{left:100px;width:44px;height:44px;display:grid;place-items:center start;font:400 12px var(--f);color:var(--mute)}
.st{width:44px;height:44px;font:700 16px var(--f);color:var(--mute)}
.mn{left:150px}
.pl{left:250px}
.rp{left:200px;width:44px;height:44px;text-align:center;font:700 20px var(--f)}
.wt::placeholder,.rp::placeholder,.ib::placeholder,.rg::placeholder{color:var(--mute);opacity:1}
.rp{font-size:20px}
.ph{position:absolute;top:0;height:44px;display:grid;place-items:center;pointer-events:none;color:var(--mute);font:700 20px var(--f);text-align:center;white-space:nowrap}
.phw{left:0;width:94px}.phr{left:200px;width:44px;font-size:8px}
.wt.sm+.ph{font-size:15px}
.wt:not(:placeholder-shown)+.ph,.rp:not(:placeholder-shown)+.ph{display:none}
.rb{position:absolute;right:0;top:0;width:44px;border-radius:10px;background:var(--red);color:var(--on);font:700 8px/22px var(--f);text-align:center;display:flex;align-items:flex-start;justify-content:center}
.rb.act{background:var(--dark)}

.ed{margin-bottom:44px}
.nr{display:flex;gap:6px;margin-bottom:14px}
.ib{display:block;width:100%;height:44px;padding:0 13px;font:700 15px var(--f);text-transform:uppercase;min-width:0}
.nr .ib{flex:1;width:auto}
.vi{font:400 12px var(--f);text-transform:none;color:var(--mute)}
.sb{width:44px;height:44px;flex:none;font:700 10px var(--f);color:var(--mute)}
.sb.dg{background:var(--red);color:var(--on)}
.lb{font:400 12px/1.35 var(--f);color:var(--mute);display:flex;align-items:center;height:44px}
.er .wt{left:50px}
.rg{left:250px;width:44px;height:44px;text-align:center;font:700 8px/1 var(--f)}
.ri{width:100%;height:22px;text-align:center;font:700 8px var(--f);color:var(--on);background:none;border-radius:0}
.ar2{display:flex;gap:6px}
.bl{height:44px;width:100%;font:700 10px var(--f);color:var(--mute)}
.ar2 .bl+.bl{flex:none;width:44px}
.tri{display:flex;gap:6px}
.tri .bl{font-size:8px}

.rday{display:grid;place-items:center;text-align:center;min-height:calc(100vh - 220px);padding:0 23px;font:700 15px/1.2 var(--f);text-transform:uppercase}
.rday small{display:block;font:400 12px/1.5 var(--f);color:var(--mute);text-transform:none;margin-top:14px}
.intro{font:400 12px/1.6 var(--f);margin:0 0 48px;max-width:313px;-webkit-user-select:text;user-select:text}
.nt{text-align:center;color:var(--mute);margin:0 23px}
.nr2{position:relative;height:44px;margin-top:14px}
.nr2 .lb{left:0;width:44px}
.nr2 .wt{left:50px}
.keep{left:150px;width:194px;height:44px;font:700 15px var(--f);color:var(--mute)}
.incs{display:flex;gap:6px;margin-top:14px}
.inc{flex:1;height:44px;font:700 16px var(--f);color:var(--mute)}
.keep,.inc{color:var(--mute)}
.mn2 .bl{margin-bottom:14px;color:var(--mute)}
.mn2 .nm.gh{margin:44px 0 16px}
.mn2 .tri .bl{margin-bottom:0}
.mn2 .dgr{color:var(--red)}

#fade{position:fixed;left:0;right:0;bottom:0;height:130px;z-index:20;pointer-events:none;background:linear-gradient(to top,var(--bg) 25%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent)}
#fade.tall{height:180px}
.bar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:390px;margin:0 auto;padding:0 23px;display:flex;justify-content:space-between;gap:6px;z-index:30}
.bt{height:44px;border-radius:10px;background:var(--dark);color:var(--on);font:700 15px var(--f)}
.tm{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(344px,calc(100% - 46px));height:44px;border-radius:10px;background:var(--dark);color:var(--on);display:flex;align-items:center;gap:12px;padding:0 19px 0 20px;z-index:30}
.tm.end{background:var(--red)}
.tn{flex:0 1 auto;min-width:0;font:400 12px/1.2 var(--f);overflow-wrap:anywhere;margin-right:auto}
.tv{font:700 15px var(--f);min-width:50px;text-align:right}
.more{height:44px;display:flex;justify-content:flex-end;align-items:center;font:700 15px var(--f);padding:0 0 0 10px;text-align:right;flex:none;margin-left:auto;white-space:nowrap}
.rz:active{box-shadow:inset -2px -2px 4px var(--shl),inset 2px 2px 4px var(--shd)}
button.rz:active{transform:scale(.97)}
.st:active,.ar:active{transform:scale(.85)}
.dy:active,.bt:active,.rb:active{transform:scale(.95)}
@media (prefers-reduced-motion:no-preference){.dy,.rb,.rz,.ps,.st,.ar,.bt{transition:background .12s,box-shadow .12s,transform .2s cubic-bezier(.3,1.6,.5,1)}.rz:active,.ps:active,.st:active,.ar:active,.dy:active,.bt:active,.rb:active{transition-duration:.06s,.06s,.06s}}
</style></head><body>
<div id="app"></div><div id="fade"></div><div id="timer" class="tm" hidden></div><div id="bar" class="bar" hidden></div>
<script>
(function(){
"use strict";
var LS_KEY="fbtl.weeks.v2";
var MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var weeks={}, curId=null, dayIdx=0, edit=false, view="day", nw=null, db=null, loadNote="";
var timer=null, tick=null, dirty={}, saving={}, saveT={};

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return n==null?"":String(Math.round(n*1000)/1000).replace(".",",")}
function pnum(s){var v=parseFloat(String(s).replace(",",".").replace(/[^0-9.\-]/g,""));return isNaN(v)?null:v}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseIso(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function weekLabel(id){
  var a=parseIso(id), b=parseIso(addDays(id,6));
  if(a.getMonth()===b.getMonth())return a.getDate()+"–"+b.getDate()+" "+MONTHS[b.getMonth()];
  return a.getDate()+" "+MONTHS[a.getMonth()]+" – "+b.getDate()+" "+MONTHS[b.getMonth()];
}
function sortedIds(){return Object.keys(weeks).sort()}
function todayIso(){return iso(new Date())}
function todayDow(){return (new Date().getDay()+6)%7}
function uid(){return "e"+Math.random().toString(36).slice(2,9)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function cur(){return weeks[curId]}

/* ---------- storage: db (shared, survives devices) + localStorage mirror ---------- */
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify(weeks))}catch(e){}}
function touch(id){
  var w=weeks[id]; if(!w)return;
  w.updatedAt=Date.now(); lsWrite(); ghSchedule();
  if(!db)return;
  dirty[id]=true; clearTimeout(saveT[id]);
  saveT[id]=setTimeout(function(){flush(id)},700);
}
function flush(id){
  if(!db||saving[id]||!dirty[id])return;
  var w=weeks[id]; if(!w)return;
  saving[id]=true; dirty[id]=false;
  var data=clone(w); delete data._synced;
  db.collection("weeks").doc(id).set(data).then(function(){
    saving[id]=false; if(dirty[id])flush(id);
  },function(){saving[id]=false;dirty[id]=true;loadNote="Не удалось сохранить в облако. Данные сохранены на этом устройстве."; paintNote()});
}
function removeWeek(id){
  delete weeks[id]; lsWrite();
  if(db)db.collection("weeks").doc(id).delete().catch(function(){});
}
function onRemote(snap){
  var changed=false;
  snap.docs.forEach(function(d){
    var r=d.data(), l=weeks[d.id];
    if(!r)return;
    if(!l||(r.updatedAt||0)>(l.updatedAt||0)){weeks[d.id]=clone(r);weeks[d.id]._synced=true;changed=true}
    else if((l.updatedAt||0)>(r.updatedAt||0)){dirty[d.id]=true;flush(d.id)}
  });
  var remote={};snap.docs.forEach(function(d){remote[d.id]=1});
  Object.keys(weeks).forEach(function(id){
    if(remote[id]){weeks[id]._synced=true;return}
    if(snap.metadata.fromCache)return;
    if(weeks[id]._synced&&!dirty[id]&&!saving[id]){delete weeks[id];changed=true}
    else if(!weeks[id]._synced){dirty[id]=true;flush(id)}
  });
  if(!snap.metadata.fromCache){clearTimeout(loadTimer);loadNote=""}
  lsWrite();
  if(changed){
    if(!weeks[curId])pickStart();
    if(!document.activeElement||document.activeElement.tagName!=="INPUT")render();
  }
  paintNote();
}
var loadTimer=null;
function connect(){
  return;
  window.claude.use("db").then(function(d){
    if(!d)return;
    db=d;
    loadTimer=setTimeout(function(){loadNote="Облако не отвечает. Показаны данные с этого устройства.";paintNote()},10000);
    db.collection("weeks").onSnapshot(onRemote,function(){loadNote="Нет доступа к облаку. Данные хранятся на этом устройстве.";paintNote()});
  },function(){});
}
function paintNote(){var n=$("#note");if(n){n.hidden=!loadNote;n.textContent=loadNote}}

/* ---------- selection ---------- */
function pickStart(){
  var ids=sortedIds(); if(!ids.length){curId=null;return}
  var t=todayIso(), hit=null;
  ids.forEach(function(id){if(id<=t&&t<=addDays(id,6))hit=id});
  curId=hit||ids[ids.length-1];
  if(hit)dayIdx=todayDow();
  else{var d=cur().days;dayIdx=0;for(var i=0;i<7;i++){if(!d[i].rest){dayIdx=i;break}}}
}
function setStats(ex){var t=0,f=0;ex.forEach(function(e){e.sets.forEach(function(s){t++;if(s.reps!=null)f++})});return{t:t,f:f}}
function dayState(d){
  if(d.rest)return "rest";
  var s=setStats(d.exercises);
  if(!s.t||!s.f)return "none";
  return s.f===s.t?"done":"part";
}

/* ---------- rendering ---------- */
var confirmDel=null, confirmWeek=false;
var SVG_L='<svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1L1 6l5 5"/></svg>';
var SVG_R='<svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 5-5 5"/></svg>';
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60)}
function parseRest(t){t=String(t).trim();var m=t.match(/^(\d+)\s*[:.,]\s*(\d{1,2})$/);if(m)return (+m[1])*60+(+m[2]);var v=pnum(t);return v==null?null:Math.max(0,Math.round(v))}
function repBg(ex,v){
  if(v==null)return "";
  var lo=ex.min,hi=ex.max;
  if(v<lo)return "hsla(0,75%,52%,.12)";
  if(v>hi)return "hsla(205,80%,55%,.12)";
  var t=hi>lo?(v-lo)/(hi-lo):1;
  return "hsla("+Math.round(48+t*87)+","+Math.round(95-t*40)+"%,50%,"+(.17-t*.04).toFixed(3)+")";
}
function wcls(v){return String(v).length>4?" sm":""}
function pillHtml(label,lp){return '<div class="pill'+(label.length>14?" sm":"")+'"'+(lp?' data-lp="'+lp+'"':"")+'>'+esc(label)+'</div>'}
function simpleTop(label){return '<div class="top plain"><div class="wk"><span class="ar"></span>'+pillHtml(label)+'<span class="ar"></span></div></div>'}
function topHtml(){
  var ids=sortedIds(), i=ids.indexOf(curId), w=cur(), last=i>=ids.length-1;
  var h='<div class="top"><div class="wk">'+
    '<button class="ar'+(i<=0?" off":"")+'" data-act="prev" aria-label="Предыдущая неделя">'+SVG_L+'</button>'+
    pillHtml(weekLabel(curId),"wkmenu")+
    (last?'<button class="ar plus" data-act="newWeek" aria-label="Новая неделя">+</button>'
         :'<button class="ar" data-act="next" aria-label="Следующая неделя">'+SVG_R+'</button>')+
    '</div><div class="days">';
  w.days.forEach(function(d,k){
    h+='<button class="dy'+(d.rest?" rest":"")+(k===dayIdx?" sel":"")+'" data-act="day" data-d="'+k+'" aria-label="'+esc(d.name)+'">'+SHORT[k]+'</button>';
  });
  return h+'</div></div>';
}
function rowHtml(ex,s,i){
  var on=s.reps!=null, wi=s.wIn!=null, wv=fmt(wi?s.wIn:s.weight);
  return '<div class="r" data-ex="'+ex.id+'" data-i="'+i+'">'+
    '<input class="wt '+(wi?"ps":"rz")+wcls(wv)+'" inputmode="decimal" placeholder=" " data-ph="'+fmt(s.weight)+'" data-f="weight" data-ex="'+ex.id+'" data-i="'+i+'" value="'+(wi?wv:"")+'" aria-label="Вес, подход '+(i+1)+'"><span class="ph phw">'+fmt(s.weight)+'</span>'+
    '<span class="kg">кг</span>'+
    '<button class="st mn" data-act="dec" aria-label="Меньше">–</button>'+
    '<input class="rp '+(on?"ps":"rz")+'"'+(on?' style="background-color:'+repBg(ex,s.reps)+'"':"")+' inputmode="numeric" data-f="reps" data-ex="'+ex.id+'" data-i="'+i+'" placeholder=" " value="'+(on?s.reps:"")+'" aria-label="Повторы, подход '+(i+1)+'"><span class="ph phr">'+ex.min+'–'+ex.max+'</span>'+
    '<button class="st pl" data-act="inc" aria-label="Больше">+</button></div>';
}
function exView(ex){
  var n=ex.sets.length, act=timer&&timer.ex===ex.id;
  var h='<div class="ex" data-ex="'+ex.id+'"><div class="nm" data-lp="editDay">'+esc(ex.name||"БЕЗ НАЗВАНИЯ")+'</div><div class="vr">'+esc(ex.variant)+'</div><div class="rs">';
  ex.sets.forEach(function(s,i){h+=rowHtml(ex,s,i)});
  return h+'<button class="rb'+(act?" act":"")+'" data-act="timer" data-ex="'+ex.id+'" style="height:'+(58*n-14)+'px" aria-label="Таймер отдыха">'+mmss(ex.rest||0)+'</button></div></div>';
}
function exEdit(ex,idx,n){
  var c=confirmDel===ex.id, k=ex.sets.length;
  var h='<div class="ex ed" data-ex="'+ex.id+'"><div class="nr"><input class="ib '+(ex.name?"ps":"rz")+'" data-f="name" data-ex="'+ex.id+'" value="'+esc(ex.name)+'" placeholder="НАЗВАНИЕ" autocapitalize="characters">'+
    '<button class="rz sb" data-act="up" data-ex="'+ex.id+'"'+(idx===0?" disabled":"")+' aria-label="Выше">↑</button>'+
    '<button class="rz sb" data-act="down" data-ex="'+ex.id+'"'+(idx===n-1?" disabled":"")+' aria-label="Ниже">↓</button>'+

/* ---------- rest timer ---------- */
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function startTimer(sec,label,exId){
  timer={end:Date.now()+sec*1000,total:sec*1000,label:label,ex:exId,done:false};
  clearInterval(tick); tick=setInterval(paintTimer,250); paintTimer(); paintActive();
}
function stopTimer(){timer=null;paintTimer();paintActive()}
function paintActive(){
  document.querySelectorAll(".rb[data-ex]").forEach(function(b){b.classList.toggle("act",!!timer&&timer.ex===b.getAttribute("data-ex"))});
}
function paintTimer(){
  var el=$("#timer"), fade=$("#fade"), bar=$("#bar");
  if(!timer){clearInterval(tick);el.hidden=true;el.removeAttribute("data-st");fade.className=bar.hidden?"":"tall";return}
  var left=(timer.end-Date.now())/1000;
  if(left<=0&&!timer.done){timer.done=true;beep()}
  if(left>0&&timer.done)timer.done=false;
  var show=view==="day"&&!!curId&&!edit;
  el.hidden=!show;
  fade.className=(show||!bar.hidden)?"tall":"";
  if(!show)return;
  var st=(timer.done?"d":"r")+"|"+timer.ex;
  if(el.getAttribute("data-st")!==st){
    el.setAttribute("data-st",st); el.className="tm"+(timer.done?" end":"");
    el.innerHTML=timer.done?
      '<span class="tn">'+esc(timer.label)+'</span><button class="more" data-act="moreSet"><span>ЕЩЁ ПОДХОД</span></button>':
      '<span class="tn">'+esc(timer.label)+'</span><b class="tv" id="tmv"></b>';
  }
  var v=$("#tmv"); if(v)v.textContent=mmss(Math.ceil(left));
  if(timer.done)el.style.background="";
  else{var pr=Math.min(1,Math.max(0,1-left*1000/timer.total)),b=pr*130,a=b-30;
    el.style.background="linear-gradient(90deg,var(--red) 0,var(--red) "+Math.max(0,a).toFixed(1)+"%,var(--dark) "+b.toFixed(1)+"%)"}
}

/* ---------- events ---------- */
function exOf(el){

  for(var i=0;i<d.exercises.length;i++)if(d.exercises[i].id===id)return d.exercises[i];

function moveEx(ex,dir){
  var a=cur().days[dayIdx].exercises,i=a.indexOf(ex),j=i+dir;
  if(j<0||j>=a.length)return; a.splice(i,1);a.splice(j,0,ex);

function stepReps(btn,dir){
  var row=btn.closest(".r"), ex=exOf(row), i=+row.getAttribute("data-i"), s=ex.sets[i];
  if(s.reps==null){s.reps=(i>0&&ex.sets[i-1].reps!=null)?ex.sets[i-1].reps:ex.max}

function nextId(dir){var ids=sortedIds(),i=ids.indexOf(curId)+dir;return ids[i]}
function findEx(id){

  for(var d=0;d<7;d++)for(var i=0;i<w.days[d].exercises.length;i++)if(w.days[d].exercises[i].id===id)return w.days[d].exercises[i];
  return null;
}
function act(a,b){
  if(a!=="del")confirmDel=null; if(a!=="delWeek")confirmWeek=false;
  var w=cur(), ex;
  switch(a){
  case "prev":case "next":{var id=nextId(a==="next"?1:-1);if(id){curId=id;edit=false;var t=todayIso();if(t>=id&&t<=addDays(id,6))dayIdx=todayDow();render();window.scrollTo(0,0)}break}
  case "day":dayIdx=+b.getAttribute("data-d");render();window.scrollTo(0,0);break;
  case "dec":stepReps(b,-1);break;
  case "inc":stepReps(b,1);break;
  case "timer":ex=exOf(b);if(ex){if(timer&&timer.ex===ex.id)stopTimer();else startTimer(ex.rest||90,ex.name||"",ex.id)}break;
  case "moreSet":stopTimer();break;
  case "editDay":edit=true;render();break;
  case "done":{var d=w.days[dayIdx];
    if(!d.exercises.length){d.rest=true;d.title="Отдых"}
    else if(d.rest){d.rest=false;if(d.title==="Отдых")d.title="Тренировка"}
    touch(curId);edit=false;render();window.scrollTo(0,0);break}
  case "wkmenu":view="menu";edit=false;render();window.scrollTo(0,0);break;
  case "closeMenu":view="day";render();break;
  case "addEx":{var dd=w.days[dayIdx];if(dd.rest){dd.rest=false;if(dd.title==="Отдых")dd.title="Тренировка"}
    dd.exercises.push({id:uid(),name:"",variant:"",min:6,max:10,rest:150,sets:[{reps:null,weight:0},{reps:null,weight:0},{reps:null,weight:0}]});
    touch(curId);render();window.scrollTo(0,document.body.scrollHeight);break}
  case "up":case "down":ex=exOf(b);if(ex){moveEx(ex,a==="up"?-1:1);touch(curId);render()}break;
  case "del":ex=exOf(b);if(ex){if(confirmDel===ex.id){var arr=w.days[dayIdx].exercises;arr.splice(arr.indexOf(ex),1);confirmDel=null;touch(curId)}else confirmDel=ex.id;render()}break;
  case "setsPlus":ex=exOf(b);if(ex){var l2=ex.sets[ex.sets.length-1];ex.sets.push({reps:null,weight:l2?l2.weight:0});touch(curId);render()}break;
  case "setsMinus":ex=exOf(b);if(ex&&ex.sets.length>1){ex.sets.pop();touch(curId);render()}break;
  case "delWeek":if(confirmWeek){var gone=curId;removeWeek(gone);confirmWeek=false;edit=false;view="day";pickStart();render();window.scrollTo(0,0)}else{confirmWeek=true;render()}break;
  case "newWeek":startNew();break;
  case "exportData":exportData();break;
  case "ghSave":ghSave();break;
  case "ghRestore":ghRestore();break;
  case "ghOff":ghSet(null);ghMsg="Отключено";ghPaint();break;
  case "importData":{var f=$("#impf");if(f)f.click();break}
  case "cancelNew":view="day";nw=null;render();break;
  case "createWeek":createWeek();break;
  case "createFirst":createFirst();break;
  case "nwOpt":{var id2=b.getAttribute("data-ex"),vv=b.getAttribute("data-v");
    if(vv==="keep")delete nw.choice[id2];
    else{var found=null;weeks[nw.src].days.forEach(function(d){d.exercises.forEach(function(e){if(e.id===id2)found=e})});nw.choice[id2]=Math.round((maxW(found)+parseFloat(vv))*1000)/1000}
    paintNw(true);break}
  }
}

/* haptic: vibrate API (Android) or the iOS Safari switch-toggle trick */
function haptic(){
  try{
    if(navigator.vibrate){navigator.vibrate(10);return}
    var l=document.createElement("label"),i=document.createElement("input");
    i.type="checkbox";i.setAttribute("switch","");l.appendChild(i);
    l.style.cssText="position:fixed;left:-99px;top:0;opacity:0;pointer-events:none";
    document.body.appendChild(l);l.click();l.remove();
  }catch(_){}
}
/* swipe between weeks */
var sw=null;

  var t=e.touches[0]; sw={x:t.clientX,y:t.clientY};
},{passive:true});

  if(!sw)return; var t=e.changedTouches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y; sw=null;

function exportData(){

  }catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

document.addEventListener("change",function(e){

function ghPush(){

    if(r.status===404)return null;
    if(!r.ok)throw r.status;
    return r.json();

    if(j&&j.sha)p.sha=j.sha;
    return fetch(ghUrl(c),{method:"PUT",headers:ghHead(c),body:JSON.stringify(p)});

    if(!r.ok)throw r.status;
    c.last=Date.now();ghSet(c);ghBusy=false;
    ghPaint("Выгружено "+new Date().toLocaleString("ru-RU"));
  }).catch(function(e){ghBusy=false;ghPaint(ghErr(e))});
}
function ghRestore(){
  var c=ghCfg(); if(!c){ghPaint("Сначала сохраните репозиторий и токен.");return}
  ghPaint("Загружаю копию…");
  fetch(ghUrl(c),{headers:ghHead(c),cache:"no-store"}).then(function(r){
    if(!r.ok)throw r.status;return r.json();
  }).then(function(j){
    var o=JSON.parse(b64d(j.content)),n=0;
    Object.keys(o).forEach(function(id){if(/^\d{4}-\d{2}-\d{2}$/.test(id)&&o[id]&&o[id].days){weeks[id]=o[id];n++}});
    if(!n)throw 0;
    lsWrite();pickStart();render();ghPaint("Восстановлено недель: "+n);
  }).catch(function(e){ghPaint(e?ghErr(e):"В файле нет данных журнала.")});
}
function ghSave(){
  var repo=($("#ghrepo").value||"").trim(), tok=($("#ghtok").value||"").trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok){ghPaint("Впишите репозиторий в формате владелец/имя и токен.");return}
  ghSet({repo:repo,token:tok,path:"backup.json",last:0});
  ghPush();
}
